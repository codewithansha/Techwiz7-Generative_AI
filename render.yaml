# Render blueprint: one web service (API + UI) and a managed Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# After the first deploy, set GENAI provider keys in the service's Environment tab.
databases:
  - name: supportnova-db
    databaseName: supportnova
    user: supportnova
    plan: free

services:
  - type: web
    name: supportnova
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supportnova-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://supportnova.onrender.com
      - key: GENAI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
