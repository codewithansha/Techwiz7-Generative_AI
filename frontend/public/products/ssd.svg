<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ssd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d24"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="ssd-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#ssd-bg)"/>
  
  <g transform="translate(110, 45)">
    <!-- Portable SSD body -->
    <rect x="0" y="0" width="180" height="210" rx="20" fill="url(#ssd-body)" stroke="#475569" stroke-width="2.5"/>
    
    <!-- Grip ridges -->
    <line x1="25" y1="50" x2="155" y2="50" stroke="#1e293b" stroke-width="3"/>
    <line x1="25" y1="65" x2="155" y2="65" stroke="#1e293b" stroke-width="3"/>
    <line x1="25" y1="80" x2="155" y2="80" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Cutout corner loop -->
    <circle cx="150" cy="30" r="14" fill="#0a0f14" stroke="#475569" stroke-width="2"/>
    <circle cx="150" cy="30" r="8" fill="#141d24"/>
    
    <!-- Capacity badge -->
    <text x="30" y="145" fill="url(#neon-cyan)" font-family="sans-serif" font-size="28" font-weight="900">1 TB</text>
    <text x="30" y="170" fill="#94a3b8" font-family="sans-serif" font-size="12" letter-spacing="1.5">NVMe 1050 MB/s</text>
    
    <!-- USB-C Port -->
    <rect x="75" y="195" width="30" height="15" rx="5" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
  </g>
</svg>
