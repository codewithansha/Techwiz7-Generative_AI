<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="stand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2028"/>
      <stop offset="100%" stop-color="#101318"/>
    </linearGradient>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#stand-bg)"/>
  
  <g transform="translate(80, 55)">
    <!-- Base Plate -->
    <polygon points="20,180 220,180 200,165 40,165" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <!-- Angled Riser Arms -->
    <path d="M50,170 L90,70 L210,70" fill="none" stroke="url(#silver-metal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70,170 L110,70 L230,70" fill="none" stroke="url(#silver-metal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Front Lip Hooks with silicone pads -->
    <path d="M85,85 L80,55 L95,55" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <path d="M105,85 L100,55 L115,55" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <!-- Ventilation Holes -->
    <line x1="130" y1="70" x2="190" y2="70" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
