<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191d24"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="lens-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#cam-bg)"/>
  
  <g transform="translate(100, 75)">
    <!-- Mount clip -->
    <path d="M100,105 L100,140 L70,150 L65,135" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Webcam pill body -->
    <rect x="15" y="40" width="170" height="65" rx="32" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    
    <!-- Outer lens ring -->
    <circle cx="100" cy="72" r="26" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="100" cy="72" r="20" fill="url(#lens-blue)"/>
    <circle cx="95" cy="67" r="6" fill="#38bdf8" opacity="0.6"/>
    
    <!-- Microphones / sensor dots -->
    <circle cx="45" cy="72" r="3" fill="#64748b"/>
    <circle cx="155" cy="72" r="3" fill="#64748b"/>
    <!-- Status LED -->
    <circle cx="70" cy="55" r="2.5" fill="#10b981"/>
  </g>
</svg>
